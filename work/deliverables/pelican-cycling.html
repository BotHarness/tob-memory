<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>鹈鹕骑自行车 · 2D 动画</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; display: grid; place-items: center;
    background: radial-gradient(circle at 50% 15%, #e8f7ff, #a9dcf5 45%, #7cc0e6);
    font-family: system-ui, -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
  }
  .wrap { width: min(94vw, 940px); }
  .card { border-radius: 22px; overflow: hidden; background: #fff; box-shadow: 0 26px 64px rgba(18, 58, 88, .35); }
  .top { padding: 13px 18px; background: #f2fbff; color: #275067; font-size: 14px; line-height: 1.55; }
  .top b { color: #0f6f9e; }
  svg { display: block; width: 100%; height: auto; }

  .bob  { animation: bob 1.5s ease-in-out infinite; }
  @keyframes bob { 0%,100% { transform: translateY(0) } 50% { transform: translateY(-7px) } }
  .wheel { transform-box: fill-box; transform-origin: center; animation: spin 1.1s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg) } }
  .leg { transform-box: fill-box; transform-origin: top center; animation: pedal .6s ease-in-out infinite; }
  .leg.b { animation-delay: -.3s; }
  @keyframes pedal { 0%,100% { transform: rotate(18deg) } 50% { transform: rotate(-18deg) } }
  .dash { animation: dash 1.2s linear infinite; }
  @keyframes dash { to { transform: translateX(-120px) } }
  .cloud { animation: drift 20s linear infinite; }
  @keyframes drift { from { transform: translateX(0) } to { transform: translateX(-280px) } }
  .beak { transform-box: fill-box; transform-origin: left center; animation: talk 1s ease-in-out infinite; }
  @keyframes talk { 0%,100% { transform: rotate(0) } 50% { transform: rotate(-5deg) } }
  .wing { transform-box: fill-box; transform-origin: 70% 60%; animation: wing .8s ease-in-out infinite; }
  @keyframes wing { 0%,100% { transform: rotate(0) } 50% { transform: rotate(-6deg) } }
</style>
</head>
<body>
<div class="wrap">
  <div class="card">
    <div class="top">
      <b>鹈鹕骑自行车</b> · SVG + CSS 循环动画，单文件无外部依赖。<br>
      说明：我当前运行在 DeepSeek V4.1 Flash（high），不能自己切换成 MAX；模型档位需要在设置里由你切换。
    </div>
    <svg viewBox="0 0 900 520" role="img" aria-label="一只鹈鹕骑着自行车的循环动画">
      <defs>
        <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0" stop-color="#c9ecff"/><stop offset="1" stop-color="#effbff"/>
        </linearGradient>
        <linearGradient id="hill" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0" stop-color="#a8dcb2"/><stop offset="1" stop-color="#6dbe86"/>
        </linearGradient>
        <linearGradient id="bike" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0" stop-color="#ff8a5c"/><stop offset="1" stop-color="#dd4f36"/>
        </linearGradient>
        <radialGradient id="feather" cx="35%" cy="30%" r="80%">
          <stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#eef1f8"/>
        </radialGradient>
      </defs>

      <rect width="900" height="520" fill="url(#sky)"/>
      <circle cx="770" cy="88" r="44" fill="#ffdf85"/>
      <g class="cloud" opacity=".92" fill="#fff">
        <ellipse cx="170" cy="92" rx="54" ry="24"/><ellipse cx="216" cy="80" rx="40" ry="19"/><ellipse cx="128" cy="82" rx="34" ry="16"/>
        <ellipse cx="520" cy="66" rx="44" ry="19"/><ellipse cx="560" cy="58" rx="32" ry="14"/>
      </g>

      <path d="M0 396 Q190 312 380 372 T900 352 V520 H0 Z" fill="url(#hill)"/>
      <path d="M0 436 Q230 396 470 426 T900 418 V520 H0 Z" fill="#54a76e" opacity=".85"/>
      <rect x="0" y="448" width="900" height="72" fill="#3c3c4d"/>
      <g class="dash" stroke="#f8f6c9" stroke-width="8" stroke-linecap="round">
        <line x1="40" y1="486" x2="112" y2="486"/><line x1="162" y1="486" x2="234" y2="486"/>
        <line x1="284" y1="486" x2="356" y2="486"/><line x1="406" y1="486" x2="478" y2="486"/>
        <line x1="528" y1="486" x2="600" y2="486"/><line x1="650" y1="486" x2="722" y2="486"/>
        <line x1="772" y1="486" x2="844" y2="486"/><line x1="894" y1="486" x2="966" y2="486"/>
        <line x1="-80" y1="486" x2="-8" y2="486"/>
      </g>

      <g class="bob">
        <!-- wheels -->
        <g class="wheel" style="transform-origin:320px 392px">
          <circle cx="320" cy="392" r="60" fill="none" stroke="#23262d" stroke-width="10"/>
          <g stroke="#9aa4af" stroke-width="4">
            <line x1="320" y1="338" x2="320" y2="446"/><line x1="266" y1="392" x2="374" y2="392"/>
            <line x1="282" y1="354" x2="358" y2="430"/><line x1="358" y1="354" x2="282" y2="430"/>
          </g>
          <circle cx="320" cy="392" r="9" fill="#23262d"/>
        </g>
        <g class="wheel" style="transform-origin:650px 392px">
          <circle cx="650" cy="392" r="60" fill="none" stroke="#23262d" stroke-width="10"/>
          <g stroke="#9aa4af" stroke-width="4">
            <line x1="650" y1="338" x2="650" y2="446"/><line x1="596" y1="392" x2="704" y2="392"/>
            <line x1="612" y1="354" x2="688" y2="430"/><line x1="688" y1="354" x2="612" y2="430"/>
          </g>
          <circle cx="650" cy="392" r="9" fill="#23262d"/>
        </g>

        <!-- frame -->
        <g fill="none" stroke="url(#bike)" stroke-width="12" stroke-linecap="round" stroke-linejoin="round">
          <path d="M320 392 L452 392 L528 306 L620 306 L650 392"/>
          <path d="M452 392 L528 306"/>
        </g>
        <g stroke="#3d404a" stroke-width="10" stroke-linecap="round">
          <line x1="618" y1="304" x2="672" y2="292"/><line x1="478" y1="304" x2="446" y2="290"/>
        </g>
        <circle cx="528" cy="306" r="13" fill="#3d404a"/>

        <!-- crank + pedals -->
        <circle cx="476" cy="392" r="26" fill="none" stroke="#3d404a" stroke-width="6"/>

        <!-- pelican -->
        <g>
          <ellipse cx="566" cy="272" rx="98" ry="62" fill="url(#feather)" stroke="#d5dbe7" stroke-width="3"/>
          <!-- neck -->
          <path d="M486 252 q-40 -64 6 -92" fill="none" stroke="url(#feather)" stroke-width="30" stroke-linecap="round"/>
          <path d="M486 252 q-40 -64 6 -92" fill="none" stroke="#d5dbe7" stroke-width="3" stroke-linecap="round" opacity=".7"/>
          <!-- head -->
          <circle cx="490" cy="164" r="41" fill="url(#feather)" stroke="#d5dbe7" stroke-width="3"/>
          <!-- beak -->
          <g class="beak">
            <path d="M452 172 q-52 4 -66 28 q44 30 102 14 q16 -8 6 -26 q-18 -20 -42 -16 Z" fill="#ffb02e"/>
            <path d="M448 182 q-38 6 -50 22 q36 20 86 8" fill="#ffd166"/>
            <path d="M452 172 q-52 4 -66 28" fill="none" stroke="#e08b00" stroke-width="3" stroke-linecap="round"/>
          </g>
          <circle cx="482" cy="156" r="6.5" fill="#2b2f36"/><circle cx="484" cy="154" r="2.2" fill="#fff"/>
          <!-- wings on handlebar -->
          <g class="wing">
            <path d="M604 246 q54 -20 78 8 q-24 46 -78 34 Z" fill="#e9edf6" stroke="#d5dbe7" stroke-width="3"/>
            <path d="M620 262 q36 -8 52 8" fill="none" stroke="#c9d1df" stroke-width="3" stroke-linecap="round"/>
          </g>
          <path d="M500 226 q-24 10 -30 40" fill="none" stroke="#e9edf6" stroke-width="18" stroke-linecap="round"/>
          <path d="M474 268 q-6 12 2 20" fill="none" stroke="#d5dbe7" stroke-width="3" stroke-linecap="round"/>
        </g>

        <!-- pedaling legs -->
        <g class="leg" style="transform-origin:476px 392px">
          <line x1="476" y1="392" x2="476" y2="432" stroke="#ffb02e" stroke-width="14" stroke-linecap="round"/>
          <path d="M458 432 q18 16 36 0" fill="none" stroke="#e08b00" stroke-width="10" stroke-linecap="round"/>
        </g>
        <g class="leg b" style="transform-origin:476px 392px">
          <line x1="476" y1="392" x2="452" y2="358" stroke="#e89a1c" stroke-width="14" stroke-linecap="round"/>
        </g>

        <!-- tail -->
        <path d="M660 258 q34 -16 46 -2 q-10 26 -38 30 Z" fill="#eef1f8" stroke="#d5dbe7" stroke-width="3"/>
      </g>

      <rect x="34" y="486" width="0" height="0" fill="none"/>
      <text x="34" y="504" fill="#fff" opacity=".7" font-size="14">鹈鹕 × 自行车 · SVG 循环动画</text>
    </svg>
  </div>
</div>
</body>
</html>
