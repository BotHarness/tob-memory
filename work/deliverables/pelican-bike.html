<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>群主骑鹈鹕 · 鹈鹕骑自行车</title>
<style>
  :root { --road:#3d3d4e; }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; display: grid; place-items: center;
    background: radial-gradient(circle at 50% 20%, #dff3ff, #9ed3f2 45%, #7fbde4);
    font-family: system-ui, -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
  }
  .wrap { width: min(92vw, 900px); }
  .card {
    border-radius: 20px; overflow: hidden; background: #fff;
    box-shadow: 0 24px 60px rgba(20, 60, 90, .35);
  }
  .cap { padding: 12px 18px; font-size: 15px; color: #2b4a5c; background: #f4fbff; }
  svg { display: block; width: 100%; height: auto; }

  /* scene animation */
  .bob   { animation: bob 1.4s ease-in-out infinite; }
  .bob2  { animation: bob 1.4s ease-in-out infinite .12s; }
  @keyframes bob { 0%,100% { transform: translateY(0) } 50% { transform: translateY(-6px) } }

  .wheel { transform-box: fill-box; transform-origin: center; animation: spin 1.1s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg) } }

  .leg   { transform-box: fill-box; transform-origin: top center; animation: pedal 0.55s ease-in-out infinite; }
  .leg-b { animation-delay: -0.27s; }
  @keyframes pedal { 0%,100% { transform: rotate(16deg) } 50% { transform: rotate(-16deg) } }

  .dash { animation: dash 1.1s linear infinite; }
  @keyframes dash { to { transform: translateX(-120px) } }

  .cloud { animation: drift 18s linear infinite; }
  @keyframes drift { from { transform: translateX(0) } to { transform: translateX(-260px) } }

  .beak { transform-box: fill-box; transform-origin: left center; animation: talk .9s ease-in-out infinite; }
  @keyframes talk { 0%,100% { transform: rotate(0) } 50% { transform: rotate(-4deg) } }

  .wing { transform-box: fill-box; transform-origin: right center; animation: flap 0.7s ease-in-out infinite; }
  @keyframes flap { 0%,100% { transform: rotate(0) } 50% { transform: rotate(-8deg) } }

  .crown { transform-box: fill-box; transform-origin: bottom center; animation: crown 2s ease-in-out infinite; }
  @keyframes crown { 0%,100% { transform: rotate(-4deg) } 50% { transform: rotate(4deg) } }
</style>
</head>
<body>
<div class="wrap">
  <div class="card">
    <svg viewBox="0 0 900 500" role="img" aria-label="群主头像骑着鹈鹕，鹈鹕骑着自行车的循环动画">
      <defs>
        <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0" stop-color="#bfe8ff"/><stop offset="1" stop-color="#eaf8ff"/>
        </linearGradient>
        <linearGradient id="hill" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0" stop-color="#9ed6a8"/><stop offset="1" stop-color="#6fbf85"/>
        </linearGradient>
        <linearGradient id="bike" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0" stop-color="#ff7a5c"/><stop offset="1" stop-color="#e0513a"/>
        </linearGradient>
      </defs>

      <rect width="900" height="500" fill="url(#sky)"/>
      <circle cx="760" cy="90" r="46" fill="#ffe08a" opacity=".95"/>
      <g class="cloud" opacity=".9">
        <g fill="#ffffff">
          <ellipse cx="180" cy="95" rx="52" ry="24"/>
          <ellipse cx="225" cy="85" rx="40" ry="20"/>
          <ellipse cx="140" cy="86" rx="34" ry="17"/>
          <ellipse cx="520" cy="70" rx="44" ry="20"/>
          <ellipse cx="560" cy="62" rx="32" ry="15"/>
        </g>
      </g>

      <path d="M0 380 Q180 300 360 360 T900 340 V500 H0 Z" fill="url(#hill)"/>
      <path d="M0 420 Q220 380 460 412 T900 404 V500 H0 Z" fill="#57a86f" opacity=".85"/>

      <rect x="0" y="432" width="900" height="68" fill="var(--road)"/>
      <g class="dash" stroke="#f7f7c8" stroke-width="8" stroke-linecap="round">
        <line x1="40"  y1="470" x2="110" y2="470"/>
        <line x1="160" y1="470" x2="230" y2="470"/>
        <line x1="280" y1="470" x2="350" y2="470"/>
        <line x1="400" y1="470" x2="470" y2="470"/>
        <line x1="520" y1="470" x2="590" y2="470"/>
        <line x1="640" y1="470" x2="710" y2="470"/>
        <line x1="760" y1="470" x2="830" y2="470"/>
        <line x1="880" y1="470" x2="950" y2="470"/>
        <line x1="-80" y1="470" x2="-10" y2="470"/>
      </g>

      <g class="bob">
        <!-- wheels -->
        <g>
          <g class="wheel" style="transform-origin:330px 380px">
            <circle cx="330" cy="380" r="56" fill="none" stroke="#22252b" stroke-width="9"/>
            <g stroke="#9aa3ad" stroke-width="4">
              <line x1="330" y1="330" x2="330" y2="430"/>
              <line x1="280" y1="380" x2="380" y2="380"/>
              <line x1="295" y1="345" x2="365" y2="415"/>
              <line x1="365" y1="345" x2="295" y2="415"/>
            </g>
            <circle cx="330" cy="380" r="8" fill="#22252b"/>
          </g>
          <g class="wheel" style="transform-origin:640px 380px">
            <circle cx="640" cy="380" r="56" fill="none" stroke="#22252b" stroke-width="9"/>
            <g stroke="#9aa3ad" stroke-width="4">
              <line x1="640" y1="330" x2="640" y2="430"/>
              <line x1="590" y1="380" x2="690" y2="380"/>
              <line x1="605" y1="345" x2="675" y2="415"/>
              <line x1="675" y1="345" x2="605" y2="415"/>
            </g>
            <circle cx="640" cy="380" r="8" fill="#22252b"/>
          </g>
        </g>

        <!-- frame -->
        <g fill="none" stroke="url(#bike)" stroke-width="11" stroke-linecap="round" stroke-linejoin="round">
          <path d="M330 380 L450 380 L520 300 L610 300 L640 380"/>
          <path d="M450 380 L520 300"/>
          <path d="M520 300 L470 300"/>
        </g>
        <g stroke="#3c3f47" stroke-width="10" stroke-linecap="round">
          <line x1="608" y1="298" x2="660" y2="286"/>
          <line x1="470" y1="298" x2="438" y2="284"/>
        </g>
        <circle cx="520" cy="300" r="12" fill="#3c3f47"/>
        <circle cx="470" cy="380" r="14" fill="#3c3f47"/>

        <!-- pedals + legs -->
        <g>
          <circle cx="470" cy="380" r="24" fill="none" stroke="#3c3f47" stroke-width="6"/>
          <g class="leg" style="transform-origin:470px 380px">
            <line x1="470" y1="380" x2="470" y2="418" stroke="#f0a04b" stroke-width="13" stroke-linecap="round"/>
            <rect x="452" y="414" width="34" height="9" rx="4" fill="#2f333b"/>
          </g>
          <g class="leg leg-b" style="transform-origin:470px 380px">
            <line x1="470" y1="380" x2="450" y2="352" stroke="#e38b34" stroke-width="13" stroke-linecap="round"/>
          </g>
        </g>

        <!-- pelican -->
        <g class="bob2">
          <ellipse cx="560" cy="268" rx="92" ry="58" fill="#f6f7fb" stroke="#d6dbe6" stroke-width="3"/>
          <path d="M482 250 q-34 -58 8 -84" fill="none" stroke="#f6f7fb" stroke-width="26" stroke-linecap="round"/>
          <circle cx="486" cy="168" r="38" fill="#f6f7fb" stroke="#d6dbe6" stroke-width="3"/>
          <g class="beak">
            <path d="M452 176 q-46 4 -58 26 q40 26 92 12 q14 -6 6 -22 q-18 -18 -40 -16 Z" fill="#ffb02e"/>
            <path d="M448 186 q-34 6 -44 20 q32 18 76 8" fill="#ffd166" opacity=".9"/>
          </g>
          <circle cx="478" cy="160" r="6" fill="#2b2f36"/>
          <circle cx="480" cy="158" r="2" fill="#fff"/>
          <g class="wing" style="transform-origin:600px 260px">
            <path d="M596 244 q52 -18 74 6 q-26 44 -74 34 Z" fill="#e7ebf4" stroke="#d6dbe6" stroke-width="3"/>
            <path d="M612 258 q34 -8 48 6" fill="none" stroke="#c9d0de" stroke-width="3" stroke-linecap="round"/>
          </g>
          <path d="M560 322 q10 26 -6 40" fill="none" stroke="#ffb02e" stroke-width="8" stroke-linecap="round"/>
          <path d="M632 322 q10 26 -6 40" fill="none" stroke="#ffb02e" stroke-width="8" stroke-linecap="round"/>
        </g>

        <!-- rider: 群主头像（简化小熊 + 皇冠，占位，不是真实头像） -->
        <g class="bob2" transform="translate(0,-6)">
          <ellipse cx="556" cy="150" rx="56" ry="58" fill="#c98b5e"/>
          <circle cx="512" cy="104" r="19" fill="#c98b5e"/>
          <circle cx="600" cy="104" r="19" fill="#c98b5e"/>
          <circle cx="512" cy="104" r="10" fill="#e8b58c"/>
          <circle cx="600" cy="104" r="10" fill="#e8b58c"/>
          <ellipse cx="556" cy="168" rx="30" ry="22" fill="#f0c9a3"/>
          <circle cx="536" cy="142" r="7" fill="#2b2a28"/>
          <circle cx="576" cy="142" r="7" fill="#2b2a28"/>
          <circle cx="538" cy="140" r="2.4" fill="#fff"/>
          <circle cx="578" cy="140" r="2.4" fill="#fff"/>
          <ellipse cx="556" cy="160" rx="9" ry="7" fill="#2b2a28"/>
          <path d="M540 180 q16 14 32 0" fill="none" stroke="#2b2a28" stroke-width="4" stroke-linecap="round"/>
          <g class="crown" style="transform-origin:556px 100px">
            <path d="M524 100 l10 -30 l12 18 l12 -28 l12 28 l12 -18 l10 30 Z" fill="#ffd54a" stroke="#e0a800" stroke-width="3"/>
            <circle cx="556" cy="66" r="5" fill="#ff7a5c"/>
          </g>
          <!-- arms holding handlebar -->
          <path d="M510 196 q-40 6 -46 -18" fill="none" stroke="#c98b5e" stroke-width="16" stroke-linecap="round"/>
          <path d="M602 196 q38 4 44 -18" fill="none" stroke="#c98b5e" stroke-width="16" stroke-linecap="round"/>
        </g>
      </g>

      <text x="36" y="466" fill="#ffffff" opacity=".75" font-size="15">群主 × 鹈鹕 × 自行车 · SVG 循环动画</text>
    </svg>
    <div class="cap">鹈鹕蹬车，群主稳坐车头。头像为示意小熊 + 皇冠占位，不是真实照片。</div>
  </div>
</div>
</body>
</html>
